name: Build native probe
on:
  push:
    paths: ['native/**', '.github/workflows/native-probe.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pgaskin/NickelHook
          ref: bcd90ba94d90d22562fb64ef2920ed3323c1dae5
          path: native/NickelHook
          persist-credentials: false
      - name: Compile with NickelTC
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src/native \
            ghcr.io/pgaskin/nickeltc:1 /bin/sh -ec 'make && arm-nickel-linux-gnueabihf-readelf -h libkobolinkprobe.so'
      - uses: actions/upload-artifact@v4
        with:
          name: kobolinkprobe-uninstalled
          path: native/libkobolinkprobe.so
          if-no-files-found: error
          retention-days: 7
